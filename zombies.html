<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Ops 1 Zombies | Play</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #1f0808 0%, #050505 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid #3d1212;
      padding: 40px;
      border-radius: 10px;
      max-width: 480px;
      box-shadow: 0 0 30px rgba(220, 38, 38, 0.2);
    }

    h1 { font-size: 26px; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #dc2626; font-weight: bold; font-size: 13px; margin-bottom: 20px; }
    
    .controls {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 25px;
      text-align: left;
    }
    .controls span { color: #fff; font-weight: bold; }

    /* The critical button that opens without iframe */
    .play-btn {
      display: block;
      width: 100%;
      background: #dc2626;
      color: #fff;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .play-btn:hover { background: #ef4444; }

    .back-btn {
      display: inline-block;
      margin-top: 15px;
      color: #666;
      text-decoration: none;
      font-size: 12px;
    }
    .back-btn:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Black Ops 1 Zombies</h1>
    <div class="subtitle">Kino der Toten • Five • Multiplayer Co-Op</div>

    <div class="controls">
      <p><span>Movement:</span> W, A, S, D</p>
      <p><span>Aim / Shoot:</span> Mouse + Left Click</p>
      <p><span>Interact / Buy:</span> F</p>
      <p><span>Reload:</span> R</p>
    </div>

    <!-- Opens cleanly with severed parent links so SharedArrayBuffer is allowed -->
    <a href="https://vel.gg/bsz" class="play-btn" rel="noopener noreferrer">
      ▶ LAUNCH GAME DIRECTLY
    </a>

    <a href="index.html" class="back-btn">← Back to Menu</a>
  </div>

</body>
</html>
