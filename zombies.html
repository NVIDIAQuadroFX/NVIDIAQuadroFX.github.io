<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Ops 1 Zombies | Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #1a0808 0%, #050505 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .launcher-card {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(220, 38, 38, 0.4);
      padding: 40px;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 0 30px rgba(220, 38, 38, 0.2);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .launch-btn {
      display: inline-block;
      width: 100%;
      background: #dc2626;
      color: #fff;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .launch-btn:hover {
      background: #ef4444;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
      transform: translateY(-2px);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
