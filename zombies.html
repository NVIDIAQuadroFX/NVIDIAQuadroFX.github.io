<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Ops 1 Zombies</title>

  <!-- 1. This script forces GitHub Pages to provide COOP/COEP headers -->
  <script src="https://cdn.jsdelivr.net/gh/gzuidhof/coi-serviceworker/coi-serviceworker.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

    /* Top bar */
    .top-bar {
      width: 100%;
      height: 38px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }
    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .top-bar a:hover { color: #dc2626; }
    .top-bar span { color: #888; font-size: 12px; }

    /* The Embedded Game Frame */
    iframe {
      width: 100%;
      height: calc(100% - 38px);
      border: none;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html">← Back to Menu</a>
    <span>Call of Duty: Black Ops 1 Zombies</span>
  </div>

  <!-- 2. The iframe with cross-origin-isolated & pointer-lock enabled -->
  <iframe 
    src="https://vel.gg/bsz" 
    allow="autoplay; gamepad; fullscreen; pointer-lock; cross-origin-isolated"
    allowfullscreen>
  </iframe>

</body>
</html>
