<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Docs</title>
  <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f141c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .launch-box {
      background: #182232;
      border: 1px solid #283b54;
      padding: 35px;
      border-radius: 10px;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h2 { margin-bottom: 8px; font-size: 22px; }
    p { color: #8fa0b5; font-size: 13px; margin-bottom: 25px; line-height: 1.5; }
    
    .launch-btn {
      display: block;
      width: 100%;
      background: #22c55e;
      color: #000;
      font-weight: 800;
      font-size: 16px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .launch-btn:hover { background: #16a34a; color: #fff; }
    
    .back-btn {
      display: inline-block;
      margin-top: 15px;
      color: #64748b;
      font-size: 12px;
      text-decoration: none;
    }
    .back-btn:hover { color: #94a3b8; }
  </style>
</head>
<body>

  <div class="launch-box">
    <h2>Kerbal Space Program</h2>
    <p>Launches in an unblocked, cloaked tab to bypass extension filters.</p>
    
    <button class="launch-btn" onclick="openGame()">▶ LAUNCH KSP</button>
    <a href="index.html" class="back-btn">← Back to Menu</a>
  </div>

  <script>
    function openGame() {
      // 1. Create a blank tab
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert("Please allow pop-ups to open the game.");
        return;
      }

      // 2. Disguise tab as Google Docs & inject full-screen original KSP stream
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Google Docs</title>
          <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
          <style>
            * { margin:0; padding:0; box-sizing:border-box; }
            body, html { width:100%; height:100%; overflow:hidden; background:#000; }
            iframe { width:100%; height:100%; border:none; display:block; }
          </style>
        </head>
        <body>
          <iframe 
            src="https://ksp.ishotupa.school" 
            allow="autoplay; gamepad; fullscreen; pointer-lock" 
            allowfullscreen>
          </iframe>
        </body>
        </html>
      `);
      win.document.close();
    }
  </script>

</body>
</html>
