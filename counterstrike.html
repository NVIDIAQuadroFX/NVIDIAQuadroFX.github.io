<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Strike</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Floating exit button */
    .exit-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(10, 10, 10, 0.75);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .exit-btn:hover {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }

    /* Full-screen game canvas */
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Floating exit button to return to your main menu -->
  <a href="index.html" class="exit-btn">← Menu</a>

  <!-- Loads webstrike.me directly on your page with full input and WebGL access -->
  <iframe 
    src="https://webstrike.me" 
    allow="autoplay; gamepad; fullscreen; pointer-lock; cross-origin-isolated; accelerometer; gyroscope"
    allowfullscreen>
  </iframe>

</body>
</html>
