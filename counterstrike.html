<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Strike | CS 1.6</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Top navigation bar */
    .top-bar {
      height: 38px;
      width: 100%;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .top-bar a:hover { color: #f59e0b; }
    .top-bar span { color: #888; font-size: 12px; }

    /* The Game Frame */
    iframe {
      width: 100%;
      height: calc(100% - 38px);
      border: none;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html">← Back to Menu</a>
    <span>Web Strike (Counter-Strike Browser FPS)</span>
  </div>

  <!-- pointer-lock is essential for mouse aiming -->
  <iframe 
    src="https://webstrikegame.com/" 
    allow="autoplay; gamepad; fullscreen; pointer-lock" 
    allowfullscreen>
  </iframe>

</body>
</html>
